<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>마트프로 자금 현황 보고</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --fg:#1b2333; --muted:#6b7488; --line:#d9deea; --accent:#1f4fd8; --err:#d33a2c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11151d; --card:#1a2030; --fg:#e8ecf4; --muted:#9aa3b8; --line:#2c3447; --accent:#6d8ff5; --err:#ff7b6e; color-scheme:dark; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; display:grid; gap:14px; }
  h1 { margin:0; font-size:20px; }
  p { margin:0; color:var(--muted); font-size:14px; }
  input[type=password] { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--fg); }
  input[type=password]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  label.rem { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--muted); }
  button { padding:12px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { color:var(--err); font-size:14px; min-height:1em; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>마트프로 자금 현황 보고</h1>
  <p>비밀번호를 넣어야 볼 수 있어요.</p>
  <input type="password" id="pw" placeholder="비밀번호" autofocus required>
  <label class="rem"><input type="checkbox" id="rem"> 이 기기에서 기억하기</label>
  <button id="go" type="submit">열기</button>
  <div id="msg" role="alert"></div>
</form>

const KEY = "mp_cash_pw";
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b(D.salt), iterations:D.iter, hash:"SHA-256" },
                                            base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b(D.iv) }, key, b(D.ct));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  go.disabled = true; msg.textContent = "";
  try {
    const html = await unlock(pw);
    try { if (document.getElementById("rem").checked) localStorage.setItem(KEY, pw); } catch (_) {}
    show(html);
  } catch (_) {
    msg.textContent = "비밀번호가 맞지 않아요.";
    go.disabled = false;
  }
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (_) {}
  if (!saved) return;
  try { show(await unlock(saved)); }
  catch (_) { try { localStorage.removeItem(KEY); } catch (_) {} }
})();
</script>
